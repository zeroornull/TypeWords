# Unsigned Windows x64 NSIS for the experimental desktop preview.
# Manual only. The Desktop regression workflow stays a check and does not
# build this package. CARGO_TARGET_DIR is left unset so cargo writes
# src-tauri/target. This installer is not signed and is not a store build.

name: Desktop installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsis:
    name: Unsigned Windows x64 NSIS
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Build unsigned NSIS
        run: pnpm run desktop:bundle:internal
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TypeWords-unsigned-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/TypeWords_*_x64-setup.exe
          if-no-files-found: error
